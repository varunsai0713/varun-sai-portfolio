<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#18181b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="480" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="398" height="478" rx="23" fill="none" stroke="#3f3f46" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Subtle glow circle behind head -->
  <circle cx="200" cy="180" r="100" fill="url(#glow)"/>

  <!-- Stylized Person Silhouette -->
  <!-- Head -->
  <circle cx="200" cy="165" r="58" fill="#52525b"/>
  <!-- Hair / Feature Accent -->
  <path d="M148 155 C150 115, 175 105, 200 105 C225 105, 250 115, 252 155 C242 135, 225 125, 200 125 C175 125, 158 135, 148 155 Z" fill="#71717a"/>
  
  <!-- Shoulders / Torso -->
  <path d="M100 370 C100 270, 140 250, 200 250 C260 250, 300 270, 300 370 Z" fill="#3f3f46"/>
  <!-- Collar / Shirt Detail -->
  <path d="M175 250 L200 295 L225 250 Z" fill="#27272a"/>
  <path d="M185 250 L200 280 L215 250 Z" fill="#52525b"/>

  <!-- Bottom Accent Ribbon / Badge -->
  <rect x="28" y="405" width="344" height="48" rx="12" fill="#18181b" fill-opacity="0.9" stroke="#3f3f46" stroke-width="1"/>
  <circle cx="54" cy="429" r="6" fill="#10b981"/>
  <text x="70" y="433" fill="#f4f4f5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Varun Sai</text>
  <text x="350" y="433" text-anchor="end" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="11">Profile Photo</text>

  <!-- Watermark overlay for easy replacement -->
  <text x="200" y="325" text-anchor="middle" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="11" letter-spacing="1">PHOTO PLACEHOLDER</text>
</svg>
